
name: Update Flutter Lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Show resolved dependencies
        run: |
          flutter pub deps --style=compact
          grep -n -A8 -B2 -E 'file_picker|flutter_plugin_android_lifecycle' pubspec.lock || true

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock

          if git diff --cached --quiet; then
            echo "pubspec.lock 没有变化，无需提交"
          else
            git commit -m "chore: update Flutter dependency lockfile"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
