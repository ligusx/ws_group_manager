name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # 每次运行都执行 pub get（不使用缓存跳过）
      - name: Flutter pub get
        run: flutter pub get

      - name: Clean Gradle
        run: flutter clean   # <--- 加上这一行，强制每次重新构建

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true
        
      - name: Verify Android Gradle config
        run: |
          echo "===== gradle.properties ====="
          cat android/gradle.properties

          echo "===== settings.gradle.kts ====="
          cat android/settings.gradle.kts

          echo "===== Gradle version ====="
          cd android
          ./gradlew --version
          
      - name: Build release APK
        run: flutter build apk --release

      - name: Build split per ABI APK
        run: flutter build apk --release --split-per-abi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-split-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
